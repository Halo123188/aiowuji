# Build aiowuji's sdist and wheel and publish them to PyPI when a version tag is pushed.
#
# To release: bump the version in pyproject.toml, commit, then tag and push:
#
#     git tag -a v0.1.0 -m "aiowuji 0.1.0" && git push origin main v0.1.0
#
# The wheel is pure Python, so one build serves every platform. Before publishing, it is installed
# on Linux and on macOS, where pip pulls each platform's Wuji SDK from PyPI (wuji-sdk on Linux,
# wuji-macos on Apple Silicon), and the tests run against that install. The wuji-macos version
# pyproject.toml pins must therefore be on PyPI before aiowuji is tagged. Running the workflow by
# hand (Actions > Release > Run workflow) only builds and checks the files.
#
# PyPI accepts them through trusted publishing: pypi.org > aiowuji > Settings > Publishing has a
# GitHub publisher for younghyopark/aiowuji, workflow release.yml, environment pypi.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not pyproject.toml's version $version"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: pipx run build --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  check:
    name: install on ${{ matrix.os }}
    needs: dist
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # macos-latest is Apple Silicon
    steps:
      - uses: actions/checkout@v7  # for the tests

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # The sim extra brings MuJoCo, so the model tests load the meshes from the installed wheel.
      - name: Install the wheel
        run: python -m pip install "$(echo dist/*.whl)[sim]"

      - name: Import the platform's Wuji SDK
        run: |
          python - <<'EOF'
          import sys
          from importlib.metadata import version

          import aiowuji

          aiowuji.import_sdk()
          sdk = "wuji-macos" if sys.platform == "darwin" else "wuji-sdk"
          print(f"aiowuji {aiowuji.__version__}, {sdk} {version(sdk)}")
          EOF

      - name: Run the tests against the install
        working-directory: tests
        run: python -m unittest discover

      - name: Run the CLI
        run: aiowuji --help

  publish:
    name: publish to PyPI
    needs: [dist, check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiowuji/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
